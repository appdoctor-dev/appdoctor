    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="18" stdDeviation="18" flood-color="#2A1580" flood-opacity="0.28"/></filter>
    <filter id="liftSmall" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dy="10" stdDeviation="10" flood-color="#14084A" flood-opacity="0.35"/></filter>
