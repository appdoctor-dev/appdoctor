<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 120 740 790">
  <title>AppDoctor</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E0FF"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFC4FF"/><stop offset="1" stop-color="#8E78FF"/></linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C86FF"/><stop offset="1" stop-color="#5734E6"/></linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6FFDA"/><stop offset="1" stop-color="#16B872"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#D7DAF0"/>
      <stop offset="0.7" stop-color="#8F95C2"/>
      <stop offset="1" stop-color="#E9EBFA"/>
    </linearGradient>
    <radialGradient id="drum" cx="0.4" cy="0.35" r="0.7">
