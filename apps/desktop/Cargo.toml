[package]
name = "appdoctor-desktop"
description = "AppDoctor: local-first App Store Optimization for macOS and Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "appdoctor"
path = "src/main.rs"

[features]
# Build-from-source escape hatch: every feature works without an AppDoctor
# account. Official installers are built without it.
no-license-check = ["appdoctor-entitlement/no-license-check"]

[dependencies]
appdoctor-apple-ads.workspace = true
appdoctor-appstore.workspace = true
appdoctor-asc.workspace = true
appdoctor-entitlement.workspace = true
appdoctor-jwt.workspace = true
appdoctor-scoring.workspace = true
appdoctor-secrets.workspace = true
appdoctor-store.workspace = true
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs.workspace = true
futures.workspace = true
gpui-kit.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
